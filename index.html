<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FXMaxTrading Demo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07101d;
  color:white;
}

header{
  background:#0d192b;
  padding:20px;
  text-align:center;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.logo span{color:#22dc87}

.demo{
  color:#ffd447;
  font-weight:bold;
  margin-top:8px;
}

.container{
  max-width:500px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#101e33;
  border:1px solid #29415f;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
}

h2{
  color:#22dc87;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #405675;
  background:#07101d;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#22dc87;
  color:#07101d;
  font-size:17px;
  font-weight:bold;
}

.secondary{
  background:#263e61;
  color:white;
}

.hidden{
  display:none;
}

.balance{
  font-size:30px;
  font-weight:bold;
  color:#22dc87;
}

.message{
  margin-top:15px;
  font-weight:bold;
}

.logout{
  background:#c93645;
  color:white;
}
</style>
</head>

<body>

<header>
  <div class="logo">⚡ FX<span>MAXTRADING</span></div>
  <div class="demo">DEMO • NO REAL MONEY</div>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">

<h2>🔐 Login</h2>

<input
  type="text"
  id="loginUser"
  placeholder="Username"
>

<input
  type="password"
  id="loginPass"
  placeholder="Password"
>

<button onclick="login()">LOGIN</button>

<button class="secondary" onclick="showRegister()">
  CREATE ACCOUNT
</button>

<div class="message" id="loginMessage"></div>

</div>


<!-- REGISTER -->
<div class="card hidden" id="registerBox">

<h2>📝 Create Account</h2>

<input
  type="text"
  id="regUser"
  placeholder="Choose username"
>

<input
  type="password"
  id="regPass"
  placeholder="Choose password"
>

<input
  type="password"
  id="regConfirm"
  placeholder="Confirm password"
>

<button onclick="register()">
  REGISTER
</button>

<button class="secondary" onclick="showLogin()">
  BACK TO LOGIN
</button>

<div class="message" id="registerMessage"></div>

</div>


<!-- DASHBOARD -->
<div class="hidden" id="dashboard">

<div class="card">

<h2>👋 Welcome!</h2>

<p>Logged in as:</p>

<strong id="username"></strong>

</div>


<div class="card">

<h2>💰 Demo Balance</h2>

<div class="balance" id="balance">
₱10,000.00
</div>

<p>Virtual funds only.</p>

</div>


<div class="card">

<h2>📊 Portfolio</h2>

<div class="balance" id="portfolio">
₱10,000.00
</div>

</div>


<div class="card">

<h2>📈 Markets</h2>

<p>BTC/USDT</p>

<h2>$65,200</h2>

<button onclick="buy()">
🟢 BUY
</button>

<button onclick="sell()" class="secondary">
🔴 SELL
</button>

<p id="tradeMessage"></p>

</div>


<button class="logout" onclick="logout()">
LOGOUT
</button>

</div>

</div>


<script>

let balance = 10000;
let portfolio = 10000;


// SHOW REGISTER
function showRegister(){

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("registerBox")
    .classList.remove("hidden");

}


// SHOW LOGIN
function showLogin(){

  document.getElementById("registerBox")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");

}


// REGISTER
function register(){

  let user =
    document.getElementById("regUser").value.trim();

  let pass =
    document.getElementById("regPass").value;

  let confirm =
    document.getElementById("regConfirm").value;

  let msg =
    document.getElementById("registerMessage");


  if(!user || !pass){

    msg.textContent =
      "Please complete all fields.";

    msg.style.color="#ff6470";

    return;
  }


  if(pass !== confirm){

    msg.textContent =
      "Passwords do not match.";

    msg.style.color="#ff6470";

    return;
  }


  localStorage.setItem("fx_user",user);
  localStorage.setItem("fx_pass",pass);


  msg.textContent =
    "Account created successfully!";

  msg.style.color="#22dc87";


  setTimeout(showLogin,1000);

}


// LOGIN
function login(){

  let user =
    document.getElementById("loginUser").value;

  let pass =
    document.getElementById("loginPass").value;


  let savedUser =
    localStorage.getItem("fx_user");

  let savedPass =
    localStorage.getItem("fx_pass");


  let msg =
    document.getElementById("loginMessage");


  if(user === savedUser && pass === savedPass){

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("dashboard")
      .classList.remove("hidden");

    document.getElementById("username")
      .textContent=user;

  }else{

    msg.textContent =
      "Invalid username or password.";

    msg.style.color="#ff6470";

  }

}


// LOGOUT
function logout(){

  document.getElementById("dashboard")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");

}


// BUY DEMO
function buy(){

  if(balance >= 1000){

    balance -= 1000;
    portfolio += 1000;

    update();

    document.getElementById("tradeMessage")
      .textContent="BUY successful: ₱1,000";

  }else{

    document.getElementById("tradeMessage")
      .textContent="Insufficient demo balance.";

  }

}


// SELL DEMO
function sell(){

  if(portfolio >= 1000){

    portfolio -= 1000;
    balance += 1000;

    update();

    document.getElementById("tradeMessage")
      .textContent="SELL successful: ₱1,000";

  }

}


// UPDATE BALANCE
function update(){

  document.getElementById("balance")
    .textContent =
    "₱" + balance.toLocaleString(
      "en-PH",
      {
        minimumFractionDigits:2
      }
    );


  document.getElementById("portfolio")
    .textContent =
    "₱" + portfolio.toLocaleString(
      "en-PH",
      {
        minimumFractionDigits:2
      }
    );

}

</script>

</body>
</html>
