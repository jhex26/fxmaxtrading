<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FXMaxTrading Demo</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07101d;
  color:white;
}

header{
  padding:20px;
  background:#0d1929;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.logo span{
  color:#22dc87;
}

.demo{
  color:#ffd43b;
  font-weight:bold;
}

main{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.warning{
  background:#101f35;
  border:1px solid #29415f;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

.warning h2{
  color:#22dc87;
  margin-top:0;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:#101f35;
  border:1px solid #29415f;
  border-radius:18px;
  padding:20px;
}

.card h3{
  color:#bbb;
  margin-top:0;
}

.balance{
  font-size:28px;
  font-weight:bold;
}

.market{
  background:#101f35;
  border:1px solid #29415f;
  border-radius:18px;
  padding:20px;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.coin{
  background:#243b5d;
  color:white;
  border:0;
  padding:13px 20px;
  border-radius:10px;
  font-weight:bold;
}

.coin.active{
  background:#22dc87;
  color:#07101d;
}

.price{
  font-size:32px;
  font-weight:bold;
  color:#22dc87;
